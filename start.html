<!DOCTYPE html>
<html>
<head>
  <title>Start Screen</title>
  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial;
    }
    button {
      display: block;
      margin: 10px auto;
      padding: 10px 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>

<h1>MY GAME</h1>
<p>Player: <span id="player-name"></span></p>

<script>
  document.getElementById('player-name').textContent = localStorage.getItem('playerName') || 'Unknown';
  function continueGame() {
    window.location.href = '/Pelihtml.html?mode=continue';
  }

  function newGame() {
    const playerName = localStorage.getItem('playerName');
    fetch('/api/game/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_name: playerName })
    }).then(() => {
      window.location.href = '/Pelihtml.html?mode=new';
    });
  }
</script>

<button onclick="continueGame()">Continue</button>
<button onclick="newGame()">New Game</button>
<button onclick="localStorage.removeItem('playerName'); window.location.href='/login.html'">Logout</button>
<button onclick="alert('You can now close this tab.')">Quit</button>

</body>
</html>
