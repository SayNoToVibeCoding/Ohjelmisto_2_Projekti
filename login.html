<!DOCTYPE html>
<html>
<head>
    <title>Game Login</title>

    <style>
        body {
            background-color: #0f0f1a;
            color: white;
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        .box {
            background-color: #1c1c2e;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }

        button {
            width: 95%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #virhe-viesti {
            color: #f44336;
            margin-top: 10px;
            display: none;
        }
    </style>

</head>
<body>

<h1>🎮 GAME LOGIN</h1>

<div class="box">
    <h2>Kirjaudu peliin</h2>

    <input id="user" type="text" placeholder="Käyttäjänimi"><br>
    <input id="password" type="password" placeholder="Salasana"><br>

    <button onclick="login()">Login</button>

    <p id="virhe-viesti">Väärä käyttäjänimi tai salasana</p>
</div>

<script>
async function login() {
    var user = document.getElementById("user").value;
    var password = document.getElementById("password").value;

    var vastaus = await fetch("http://localhost:5000/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ user: user, password: password })
    });

    var data = await vastaus.json();

    if (data.status === 'ok') {
    localStorage.setItem('playerName', user);
    window.location.href = '/Pelihtml.html';
}
}
</script>

</body>
</html>
